# ================================================================
# SPRINGDOC / SWAGGER UI (NEW - not in Node version)
# After starting the app, visit: http://localhost:3000/swagger-ui.html
# You'll see a beautiful interactive API documentation page.
# Great to show during interviews or demos.
# ================================================================
