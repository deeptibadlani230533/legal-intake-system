# ================================================================
# APPLICATION PROPERTIES
# This file is Spring Boot's configuration center.
# Equivalent to your .env file + Fastify plugin registrations combined.
# Spring reads this automatically on startup - no dotenv.config() needed.
# ================================================================

# ---- Server Port ----
# Your Node backend runs on 3000. We keep the same port so docker-compose,
# the React frontend's VITE_API_URL, and EC2 security groups don't need changes.
server.port=3000

razorpay.key.id=rzp_test_SlhL77QzCxXRTf
razorpay.key.secret=EobGf1fYnZKwQxOgn4P4YgHn

# ---- Application Name ----
spring.application.name=legal-intake-backend

# ================================================================
# DATABASE CONFIGURATION (replaces config.cjs + Sequelize constructor)
# Spring Boot auto-creates the connection pool (HikariCP) using these.
# The ${} syntax reads from environment variables - same as process.env in Node.
# ================================================================
spring.datasource.url=jdbc:postgresql://db:5432/legal_intake_db
spring.datasource.username=postgres
spring.datasource.password=root

# Connection pool settings - HikariCP (industry standard, comes with Spring)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ================================================================
# JPA / HIBERNATE CONFIGURATION (replaces db.sequelize.sync())
# ================================================================

# ddl-auto controls what Hibernate does to your schema on startup.
# "validate" = check that DB tables match your @Entity classes, but DON'T change anything.
# This is safe for production since your tables already exist from Sequelize migrations.
# Options: none | validate | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update

# Naming strategy: converts Java camelCase field names to snake_case column names.
# e.g., caseTitle (Java) -> case_title (DB column)  ... BUT your DB uses camelCase!
# So we use PhysicalNamingStrategyStandardImpl to keep names exactly as written in @Column.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jackson.serialization.write-dates-as-timestamps=false
# Show the actual SQL queries Hibernate runs - very useful for debugging.
# Set to false in production.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Postgres dialect tells Hibernate to generate Postgres-specific SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ================================================================
# JWT CONFIGURATION (replaces plugins/jwt.js)
